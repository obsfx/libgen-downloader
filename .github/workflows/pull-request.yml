name: Pull Request CI

on:
  pull_request:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: pull-request-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck, test, lint, and build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Lint
        run: bun run lint

      - name: Check formatting
        run: bun run format:check

      - name: Cache embedded models
        uses: actions/cache@v4
        with:
          path: assets/models
          key: embedded-models-${{ hashFiles('scripts/models/manifest.ts') }}

      - name: Build and smoke-test Node.js bundle
        run: |
          bun run build
          node build/index.js --help
